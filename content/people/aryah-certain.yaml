name: Aryah Certain
draft: true
roleEn: Founder and President
roleEs: Fundadora y Presidenta
bioEn: >-
  Aryah Certain founded Creation and Connoisseur while studying at UNLV, where
  she is completing degrees in Information Systems, Finance, and Insurance and
  Risk Management. Born and raised in Las Vegas, she is a Rotarian and the
  founder of two local companies, and she started this organization because the
  students around her were hungry and the food on offer rarely felt like home.
  She leads the organization's partnerships, fundraising and the planned mobile
  food pantry.
bioEs: >-
  Aryah Certain fundó Creation and Connoisseur mientras estudiaba en UNLV, donde
  cursa carreras en Sistemas de Información, Finanzas, y Seguros y Gestión de
  Riesgos. Nacida y criada en Las Vegas, es rotaria y fundadora de dos empresas
  locales, y creó esta organización porque los estudiantes a su alrededor pasaban
  hambre y la comida disponible rara vez sabía a hogar. Dirige las alianzas de la
  organización, la recaudación de fondos y la despensa móvil de alimentos que está
  en planificación.
