unlvStatementEn: >-
  Creation and Connoisseur is an independent 501(c)(3) nonprofit organization.
  Its campus program, the UNLV Food Tasting Club, is a registered student
  organization at the University of Nevada, Las Vegas. Neither the nonprofit nor
  the club speaks for the university, and nothing on this site implies the
  university's sponsorship or endorsement.
unlvStatementEs: >-
  Creation and Connoisseur es una organización sin fines de lucro independiente
  501(c)(3). Su programa en el campus, el UNLV Food Tasting Club, es una
  organización estudiantil registrada en la Universidad de Nevada, Las Vegas. Ni
  la organización ni el club hablan en nombre de la universidad, y nada en este
  sitio implica el patrocinio o respaldo de la universidad.
descriptionEn: >-
  Creation and Connoisseur is a 501(c)(3) nonprofit focused on food insecurity
  at UNLV, owned and run by Aryah Certain.
descriptionEs: >-
  Creation and Connoisseur es una organización sin fines de lucro 501(c)(3)
  enfocada en la inseguridad alimentaria en UNLV. Pertenece a Aryah Certain,
  quien también la dirige.
