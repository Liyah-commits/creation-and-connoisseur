      altEn: "A plate of yellow rice, roasted chicken, fried fritters and noodles beside two cups of Thai iced tea at a club event."
      altEs: "Un plato de arroz amarillo, pollo asado, frituras y fideos junto a dos vasos de té tailandés helado en un evento del club."
  volunteer:
    discriminant: true
    value:
      image: ./images/highlights/homeCardPhotos/volunteer/value/image.webp
      altEn: "A gloved volunteer spoons chopped cilantro and onion onto a plate of tacos and empanadas beside a tray of lime wedges."
      altEs: "Una persona voluntaria con guantes sirve cilantro y cebolla picados sobre un plato de tacos y empanadas junto a una bandeja de limones."
  donate:
