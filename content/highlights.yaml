    labelEs: personas alimentadas
  - value: 100+
    valueEs: ''
    labelEn: families fed
    labelEs: familias alimentadas
  - value: Hundreds
    valueEs: Cientos
    labelEn: of students at culture nights
    labelEs: de estudiantes en noches culturales
headerPhotos:
  about:
    discriminant: true
    value:
      image: ./images/highlights/headerPhotos/about/value/image.webp
      altEn: "The six members of the 2026 to 2027 UNLV Food Tasting Club executive board pose together on a city street."
      altEs: "Los seis miembros de la junta ejecutiva 2026 a 2027 del UNLV Food Tasting Club posan juntos en una calle de la ciudad."
  programs:
    discriminant: true
    value:
      image: ./images/highlights/headerPhotos/programs/value/image.webp
      altEn: "A full classroom of students, many in superhero costumes, poses together at the fall 2026 kickoff meeting."
      altEs: "Un salón lleno de estudiantes, muchos disfrazados de superhéroes, posa en grupo en la reunión de inicio del otoño de 2026."
  news:
    discriminant: true
    value:
      image: ./images/highlights/headerPhotos/news/value/image.webp
      altEn: "A student speaker with a microphone shares her Filipina experience in front of a slide reading This is our story."
      altEs: "Una estudiante con micrófono comparte su experiencia como filipina frente a una diapositiva que dice This is our story."
  getHelp:
    discriminant: true
    value:
      image: ./images/highlights/headerPhotos/getHelp/value/image.webp
      altEn: "A gloved volunteer spoons chopped cilantro and onion onto a plate of tacos and empanadas beside a tray of lime wedges."
      altEs: "Una persona voluntaria con guantes sirve cilantro y cebolla picados sobre un plato de tacos y empanadas junto a una bandeja de limones."
  donate:
    discriminant: true
    value:
      image: ./images/highlights/headerPhotos/donate/value/image.webp
      altEn: "Two students eat plates of Filipino food at a round table."
      altEs: "Dos estudiantes comen platos de comida filipina en una mesa redonda."
  contact:
    discriminant: true
    value:
      image: ./images/highlights/headerPhotos/contact/value/image.webp
      altEn: "Around fifty students fill a classroom under a projected Food Tasting Club slide at a general meeting."
      altEs: "Unos cincuenta estudiantes llenan un salón de clases bajo una diapositiva proyectada del Food Tasting Club durante una reunión general."
  volunteer:
    discriminant: true
    value:
      image: ./images/highlights/headerPhotos/volunteer/value/image.webp
      altEn: "A volunteer hands a bag of groceries to a man with a rolling cart at an outdoor food distribution, beside a table of donated food boxes."
      altEs: "Una voluntaria entrega una bolsa de comestibles a un hombre con un carrito en una distribución de alimentos al aire libre, junto a una mesa con cajas de alimentos donados."
