heroImage:
  discriminant: true
  value:
    image: ./images/highlights/heroImage/value/image.webp
    altEn: "About sixty students gather behind a row of Thai dancers in traditional dress at Thai Night, a Food Tasting Club culture night."
    altEs: "Unos sesenta estudiantes se reúnen detrás de una fila de bailarines tailandeses con vestimenta tradicional en una noche cultural del Food Tasting Club dedicada a la cultura tailandesa."
stats:
  - value: 1,000+
    valueEs: ''
