    value:
      image: ./images/highlights/homeCardPhotos/donate/value/image.webp
      altEn: "About thirty students pose under a Food Tasting Club slide at the spring 2026 welcome back pizza and karaoke night."
      altEs: "Unos treinta estudiantes posan bajo una diapositiva del Food Tasting Club en la noche de pizza y karaoke de bienvenida de la primavera de 2026."
